<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>기후변화 수사대 : 사라지는 사계절</title>
<style>
:root{--ink:#1c2340;--sub:#5b6385;--line:#e6e9f5;--pri:#5b5bf0;--hot:#ff6b4a;--ok:#1fb27a;--gold:#ffc23d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:#0a1430;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;word-break:keep-all}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
input{font:inherit}
svg.art{width:100%;height:100%;display:block}
mark{background:linear-gradient(transparent 45%,#ffe36b 45%);color:inherit;font-weight:800;padding:0 2px}
#view{position:fixed;left:0;right:0;bottom:0;top:64px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
body.nohud #view{top:0}body.nohud #hud{display:none}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(180deg,#18245a,#0f1838);color:#fff;z-index:60;box-shadow:0 4px 20px rgba(0,0,0,.35)}
#hud .brand{font-weight:900;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:6px}
#hud .me{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:40px;padding:3px 12px 3px 3px}
#hud .me svg{width:42px;height:42px}
#hud .me b{display:block;font-size:14px}#hud .me small{font-size:11px;color:#ffd77a}
#hud .stat{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:14px;padding:6px 10px}
#hud .stat b{font-size:17px}#hud .stat small{font-size:11px;opacity:.75}
#hud .prog{flex:1;min-width:90px}
#hud .bar{height:12px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
#hud .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ee6a8,#ffd23a,#ff7a4a);transition:width .8s}
#hud .prog small{font-size:11px;opacity:.85}
#hud nav{display:flex;gap:6px}
#hud nav button{display:flex;flex-direction:column;align-items:center;font-size:20px;line-height:1;background:rgba(255,255,255,.1);border-radius:12px;padding:6px 10px;transition:.15s}
#hud nav button span{font-size:11px;margin-top:3px}
#hud nav button:hover{background:rgba(255,255,255,.22)}
@media(max-width:900px){#hud .brand b,#hud .stat small{display:none}#hud .me div{display:none}}
@media(max-width:600px){#hud .prog small{display:none}#hud nav button span{display:none}#hud{gap:6px;padding:0 6px}}
/* 공통 */
.space{min-height:100%;background:radial-gradient(ellipse at 50% 120%,#1e48a8 0,#0a1430 55%,#050915 100%);color:#fff;position:relative;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cde,transparent),radial-gradient(2px 2px at 220px 160px,#fff,transparent),radial-gradient(1px 1px at 300px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 360px 220px,#bdf,transparent),radial-gradient(1px 1px at 80px 260px,#fff,transparent);background-size:400px 300px;animation:tw 6s ease-in-out infinite alternate;opacity:.8}
@keyframes tw{to{opacity:.4}}
.glass{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:linear-gradient(180deg,#ff8a4c,#ff5f3a);color:#fff;font-weight:900;padding:12px 24px;border-radius:999px;box-shadow:0 5px 0 #c8411f,0 10px 22px rgba(255,95,58,.35);transition:transform .08s,box-shadow .08s;font-size:16px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c8411f}
.btn.blue{background:linear-gradient(180deg,#6a8bff,#4a5ff0);box-shadow:0 5px 0 #3040b8,0 10px 22px rgba(74,95,240,.35)}
.btn.green{background:linear-gradient(180deg,#3ad69a,#16a874);box-shadow:0 5px 0 #0d7a52,0 10px 22px rgba(22,168,116,.35)}
.btn.ghost{background:rgba(255,255,255,.15);box-shadow:none;border:2px solid rgba(255,255,255,.4)}
.btn[disabled]{filter:grayscale(1);opacity:.55;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:800;background:rgba(0,0,0,.08);padding:8px 14px;border-radius:30px}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
h2.st{font-size:clamp(20px,3vw,28px);font-weight:900}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800;background:#eef;color:#445}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:10px;background:linear-gradient(90deg,#7cc0ff,#ffb067,#ff5a3a);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:5px solid #ff6b4a;box-shadow:0 3px 10px rgba(0,0,0,.3);cursor:grab}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid #ff6b4a;cursor:grab}
.edu{font-size:12px;color:#7a6a3a;background:#fff6d6;border:1px dashed #e8c96a;border-radius:10px;padding:6px 10px;margin-top:8px}
/* 인트로 */
.intro{height:100%}
.ecv{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(78vh,92vw);height:min(78vh,92vw)}
.ititle{position:absolute;top:5%;left:0;right:0;text-align:center;animation:rise 1.2s both}
.ititle small{letter-spacing:4px;color:#9fc3ff;font-weight:700}
.ititle h1{font-size:clamp(34px,7vw,72px);font-weight:900;background:linear-gradient(180deg,#fff,#9fd2ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(120,180,255,.4)}
.ititle h2{font-size:clamp(18px,3.4vw,32px);color:#ffcf6b;font-weight:900;margin-top:-4px}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.alerts{position:absolute;inset:0;pointer-events:none}
.alert{position:absolute;background:rgba(255,50,40,.9);color:#fff;font-size:13px;font-weight:800;padding:5px 10px;border-radius:10px;animation:pop .4s both,blink2 1.2s 0.4s infinite;box-shadow:0 0 20px rgba(255,60,40,.7)}
@keyframes pop{from{transform:scale(0)}}
@keyframes blink2{50%{opacity:.6}}
.dlg{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:min(760px,94vw);display:flex;align-items:flex-end;gap:10px;opacity:0;transition:.5s}
.dlg.on{opacity:1}
.bubble{flex:1;background:#fff;color:var(--ink);border-radius:22px;padding:16px 18px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.bubble b{color:#4a5ff0;font-size:13px}
.bubble p{font-size:clamp(16px,2.4vw,20px);font-weight:700;min-height:2.6em;margin:4px 0 8px;line-height:1.4}
.bubble .btn{float:right;padding:9px 18px}
.bot .eye{animation:eye 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes eye{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bot .blink{animation:blink2 1s infinite}
.botwrap{animation:float 3s ease-in-out infinite;flex-shrink:0}
@keyframes float{50%{transform:translateY(-10px)}}
.skip{position:absolute;top:14px;right:14px;color:#fff;opacity:.7;font-weight:700;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:20px}
/* 설정 */
.setup{display:flex;align-items:center;justify-content:center;min-height:100%;padding:20px}
.setup .panel{padding:26px;width:min(760px,100%);text-align:center;position:relative}
.setup h2{font-size:28px;font-weight:900;margin-bottom:12px}
.setup input[type=text]{width:min(340px,100%);font-size:22px;font-weight:800;text-align:center;padding:12px;border-radius:16px;border:3px solid #7fa6ff;background:#fff;color:var(--ink);outline:none}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 22px}
.av{background:rgba(255,255,255,.1);border:3px solid transparent;border-radius:20px;padding:10px 4px;transition:.2s;color:#fff}
.av svg{width:min(100px,18vw);height:auto}
.av b{display:block;font-size:13px;margin-top:4px}
.av.on{border-color:#ffd23a;background:rgba(255,210,58,.18);transform:translateY(-6px)}
@media(max-width:560px){.avs{grid-template-columns:repeat(2,1fr)}}
/* 허브 */
.hub .wrap{position:relative;z-index:1}
.hubtop{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:18px;align-items:center}
.globebox{aspect-ratio:1;position:relative}
.globebox canvas{width:100%;height:100%}
.hubmsg{display:flex;gap:10px;align-items:center;padding:14px 18px}
.hubmsg p{font-size:17px;font-weight:700;line-height:1.5}
.hubmsg h2{font-size:24px;font-weight:900;color:#ffd77a}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.stage{position:relative;text-align:left;padding:16px;border-radius:22px;color:#fff;min-height:170px;overflow:hidden;transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.stage:hover{transform:translateY(-5px)}
.stage .ic{font-size:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.stage .n{font-size:12px;font-weight:900;opacity:.85;letter-spacing:1px}
.stage b{display:block;font-size:19px;margin:2px 0 4px}
.stage small{font-size:13px;opacity:.9}
.stage .sp{margin-top:10px;height:8px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.stage .sp i{display:block;height:100%;background:#fff}
.stage.lock{filter:grayscale(.9) brightness(.6);pointer-events:none}
.stage.lock::after{content:'🔒 잠김';position:absolute;right:12px;top:12px;font-weight:900;font-size:13px;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:12px}
.stage.done::after{content:'✔ 완료';position:absolute;right:12px;top:12px;font-weight:900;font-size:13px;background:#fff;color:#16a874;padding:4px 10px;border-radius:12px}
.stage .lockmsg{display:block;margin-top:6px;font-size:12px}
@media(max-width:700px){.hubtop{grid-template-columns:1fr}.globebox{max-width:260px;margin:0 auto}}
/* 조사본부 */
.lab{min-height:100%;background:linear-gradient(180deg,#e8f0ff 0,#d6e4ff 55%,#b9c9ec 55.2%,#aebee3 100%);position:relative}
.lab::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 120px,rgba(255,255,255,.35) 120px 124px),radial-gradient(ellipse at 50% 0,rgba(255,255,255,.9),transparent 60%);pointer-events:none}
.labhead{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.labhead p{color:var(--sub);font-weight:600}
.labcnt{background:#1c2a6a;color:#fff;padding:10px 16px;border-radius:16px;font-weight:900}
.rooms{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:16px}
.room{background:#fff;border-radius:22px;overflow:hidden;text-align:left;box-shadow:0 12px 26px rgba(30,40,90,.18);transition:.2s;display:flex;flex-direction:column;border:4px solid #fff}
.room:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 18px 36px rgba(30,40,90,.28)}
.room .rart{height:130px;position:relative}
.room .rart::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.35))}
.room .rinfo{padding:12px 14px 14px;flex:1}
.room .rinfo b{font-size:17px;display:block;margin:2px 0}
.room .rinfo small{color:var(--sub)}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:#e1e5f2}
.dots i.on{background:var(--c,#3ad69a);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c,#3ad69a)}
.door{display:block;text-align:center;padding:10px;font-weight:900;color:#fff}
/* 기관 테마 */
.inst{min-height:100%;position:relative;overflow:hidden}
.ihead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:relative;z-index:2}
.ihead h2{font-size:clamp(20px,3vw,30px);font-weight:900}
.ihead p{font-weight:600;opacity:.8}
.th-wx{background:linear-gradient(180deg,#8ccfff,#e6f5ff 60%)}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50%;height:150%;left:15%;top:-60%}.cloud::after{width:40%;height:120%;right:12%;top:-40%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}
.wxboard{position:relative;z-index:1;background:rgba(255,255,255,.75);border-radius:26px;padding:16px;margin-top:14px;box-shadow:0 10px 30px rgba(40,100,180,.15)}
.wxboard h3{font-weight:900;color:#1f5fae;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dcard{background:#fff;border-radius:18px;overflow:hidden;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.1);transition:.2s;position:relative;display:flex;flex-direction:column}
.dcard:hover{transform:translateY(-4px)}
.dcard .th{height:120px}
.dcard .tx{padding:10px 12px 14px}
.dcard .tx b{font-size:15px;line-height:1.35;display:block}
.dcard .tx small{color:var(--sub);font-size:12px;display:block;margin-top:4px}
.dcard.got::after{content:'✔ 수집';position:absolute;top:8px;right:8px;background:#16a874;color:#fff;font-size:12px;font-weight:900;padding:3px 9px;border-radius:12px}
.dcard .new{position:absolute;top:8px;left:8px;background:#ff5f3a;color:#fff;font-size:11px;font-weight:900;padding:3px 8px;border-radius:10px;animation:blink2 1s infinite}
/* 뉴스룸 */
.th-news{background:radial-gradient(ellipse at 50% 0,#3a2350,#0d1022 70%);color:#fff}
.studio{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:14px}
.tv{background:#0b0e1d;border:6px solid #3a3f68;border-radius:18px;overflow:hidden;box-shadow:0 0 50px rgba(120,80,255,.3)}
.tvs{aspect-ratio:16/9;position:relative;background:linear-gradient(135deg,#1d4f8a,#0f2a52);overflow:hidden}
.tvs .anchor{position:absolute;left:4%;bottom:0}
.tvs .desk{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#2a3168,#161a3a)}
.tvs .onair{position:absolute;top:10px;left:10px;background:#e8395b;padding:3px 10px;border-radius:6px;font-weight:900;font-size:12px;animation:blink2 1s infinite}
.tvs .bigt{position:absolute;right:4%;top:14%;width:52%;background:rgba(255,255,255,.95);color:#111;border-radius:10px;padding:10px 12px;font-weight:900;font-size:clamp(14px,1.8vw,19px);line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tvs .bigt small{display:block;color:#e8395b;font-size:12px}
.tvs .mini{position:absolute;right:4%;bottom:26%;width:52%;height:34%;border-radius:8px;overflow:hidden;border:3px solid #fff}
.ticker{background:#e8395b;white-space:nowrap;overflow:hidden;font-weight:800;padding:7px 0}
.ticker div{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.hls{display:flex;flex-direction:column;gap:9px}
.hl{display:flex;align-items:center;gap:10px;text-align:left;background:linear-gradient(90deg,#fff,#eef1ff);color:#111;border-radius:12px;padding:10px 12px;font-weight:800;border-left:8px solid #e8395b;transition:.15s}
.hl:hover{transform:translateX(6px)}
.hl .tag{background:#e8395b;color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;flex-shrink:0}
.hl.got{border-left-color:#16a874}.hl.got .tag{background:#16a874}
@media(max-width:820px){.studio{grid-template-columns:1fr}}
/* 기후변화센터 */
.th-ctr{background:#e3f8f4;background-image:linear-gradient(#cdeee8 1px,transparent 1px),linear-gradient(90deg,#cdeee8 1px,transparent 1px);background-size:28px 28px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:18px}
.folder{position:relative;text-align:left;background:var(--fc);border-radius:4px 18px 18px 18px;padding:14px;color:#fff;min-height:190px;box-shadow:0 10px 22px rgba(0,60,60,.2);transition:.2s;margin-top:14px}
.folder::before{content:attr(data-tab);position:absolute;top:-24px;left:0;background:var(--fc);padding:4px 14px;border-radius:12px 12px 0 0;font-size:12px;font-weight:900}
.folder:hover{transform:rotate(-1deg) translateY(-4px)}
.folder .ph{height:96px;border-radius:12px;overflow:hidden;border:3px solid rgba(255,255,255,.6);margin-bottom:8px}
.folder b{font-size:16px}
.folder.got::after{content:'✔';position:absolute;right:12px;top:10px;background:#fff;color:#16a874;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900}
/* 생태 */
.th-eco{background:radial-gradient(circle at 10% 10%,#d7f5c4,transparent 40%),radial-gradient(circle at 90% 80%,#c9efb4,transparent 40%),#effae6}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:16px}
.spec{background:#fffdf5;border:10px solid #8a5a32;border-radius:10px;box-shadow:inset 0 0 0 3px #c9955e,0 8px 20px rgba(60,40,10,.25);text-align:left;transition:.2s;position:relative}
.spec:hover{transform:translateY(-4px) rotate(.5deg)}
.spec .ph{height:130px}
.spec .lb{padding:8px 10px;font-weight:800;background:#fff4d8;border-top:2px dashed #c9955e}
.spec .lb small{display:block;font-weight:600;color:#7a6040;font-size:12px}
.spec.got::after{content:'조사 완료';position:absolute;right:-6px;top:10px;background:#3e9e3e;color:#fff;font-weight:900;font-size:12px;padding:3px 10px;border-radius:4px;transform:rotate(8deg)}
.magn{position:absolute;left:8px;top:8px;font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
/* 농업 */
.th-agri{background:linear-gradient(180deg,#fff1cf,#ffe3a8)}
.agri{display:grid;grid-template-columns:minmax(260px,430px) 1fr;gap:18px;margin-top:14px;align-items:start}
.mapbox{background:#fff;border-radius:22px;padding:10px;box-shadow:0 10px 26px rgba(120,80,0,.18);position:relative}
.zwrap{overflow:hidden;border-radius:16px;position:relative;aspect-ratio:330/440;touch-action:none;background:#bfe3f7}
.zin{width:100%;height:100%;transform-origin:0 0;transition:transform .2s}
.zin .kmap{width:100%;height:100%;display:block}
.kmap .rg{transition:opacity .6s}
.zbtn{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zbtn button{width:38px;height:38px;border-radius:12px;background:#fff;font-size:20px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:8px;color:#555}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:middle}
.cropbar{display:flex;gap:8px;flex-wrap:wrap}
.crop{background:#fff;border-radius:16px;padding:10px 14px;font-weight:900;font-size:16px;box-shadow:0 4px 0 #e2c58a;border:3px solid transparent;transition:.15s}
.crop.on{border-color:#e88a0c;transform:translateY(-3px)}
.crop .ck{color:#16a874;margin-left:4px}
.seg{display:inline-flex;background:#fff;border-radius:30px;padding:4px;gap:4px;box-shadow:inset 0 0 0 2px #eadbb8;margin:10px 0}
.seg button{padding:8px 16px;border-radius:24px;font-weight:900;color:#8a6a3a}
.seg button.on{background:#e88a0c;color:#fff}
.cinfo{background:#fff;border-radius:20px;padding:16px;margin-top:10px;box-shadow:0 8px 20px rgba(120,80,0,.12);line-height:1.6}
.cinfo h3{font-size:20px;font-weight:900;margin-bottom:6px}
.tagobs{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:8px;background:#1fb27a;color:#fff;margin-right:4px}
.tagproj{background:#8b5cf6}
@media(max-width:760px){.agri{grid-template-columns:1fr}}
/* 리더(자료 상세) */
#reader{position:fixed;left:0;right:0;bottom:0;top:64px;overflow-y:auto;z-index:40;background:#f4f6fb;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
#reader.on{transform:none}
.rdbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;background:var(--tc);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.rdbar button{background:rgba(255,255,255,.22);padding:7px 14px;border-radius:20px;font-weight:800}
.rdbar span{font-weight:900}
.rd article{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.rd .hero{height:clamp(170px,32vw,300px);border-radius:22px;overflow:hidden;position:relative;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.rd .breaking{position:absolute;left:12px;top:12px;background:#e8395b;color:#fff;font-weight:900;padding:4px 12px;border-radius:8px}
.rd h1{font-size:clamp(22px,3.4vw,32px);font-weight:900;margin:18px 0 8px;line-height:1.3}
.rd .lead{font-size:18px;line-height:1.7;color:#333;font-weight:600}
.rd .key{margin:16px 0;background:linear-gradient(135deg,#fff7d1,#ffe9a8);border-radius:18px;padding:14px 16px;border:3px solid #ffd257}
.rd .key b{color:#a86a00}
.rd .key p{font-size:19px;font-weight:900;margin-top:4px;line-height:1.5}
.sec{background:#fff;border-radius:18px;padding:14px 16px;margin-top:12px;box-shadow:0 4px 14px rgba(0,0,0,.05);display:flex;gap:12px}
.sec .si{font-size:28px;flex-shrink:0;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#f1f3fb}
.sec h4{font-size:15px;color:var(--tc);font-weight:900;margin-bottom:4px}
.sec p{font-size:17px;line-height:1.75}
.more{background:#eef4ff;border-radius:16px;padding:14px 16px;margin-top:12px;font-size:16px;line-height:1.7;border-left:6px solid #6a8bff}
.srcbox{margin-top:14px;font-size:14px;color:#556;background:#fff;border:2px dashed #cdd3e6;border-radius:14px;padding:10px 14px}
.stamp{margin:18px auto 0;text-align:center;font-weight:900;color:#16a874;font-size:18px;border:4px solid #16a874;border-radius:16px;padding:10px;max-width:420px;transform:rotate(-2deg);background:#fff}
.stamp.anim{animation:stampin .6s both}
@keyframes stampin{0%{transform:scale(3) rotate(-12deg);opacity:0}70%{transform:scale(.95) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-2deg)}}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.chart{background:#fff;border-radius:18px;padding:14px;margin-top:12px}
.chart h4{font-weight:900;margin-bottom:8px}
.crow{display:flex;align-items:center;gap:8px;margin:8px 0}
.crow>span{width:96px;font-size:13px;font-weight:800;color:#555;flex-shrink:0}
.cbar{flex:1;display:flex;height:40px;border-radius:10px;overflow:hidden}
.cbar div{display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(11px,1.6vw,15px);white-space:nowrap;transition:flex 1s;overflow:hidden}
.c-sp{background:#14b88a}.c-su{background:#f25c78}.c-au{background:#f59a3c}.c-wi{background:#4a8fd8}
/* 모달 */
#modal{position:fixed;inset:0;z-index:80;background:rgba(5,10,30,.6);display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)}
#modal.on{display:flex;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.mbox{background:#fff;border-radius:26px;width:min(980px,100%);max-height:92vh;overflow-y:auto;position:relative;padding:20px;animation:pop .3s}
.mbox .x{position:sticky;top:0;float:right;width:40px;height:40px;border-radius:50%;background:#eef;font-size:18px;font-weight:900;z-index:2}
.mbox h2{font-size:24px;font-weight:900;margin-bottom:10px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.ecard{border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12);text-align:left;border:3px solid #fff;transition:.15s;display:flex;flex-direction:column}
.ecard:hover{transform:translateY(-3px)}
.ecard .th{height:84px}
.ecard b{font-size:13px;padding:6px 8px 8px;line-height:1.3;display:block}
.ecard.lk{background:#eef0f7;box-shadow:none;border:3px dashed #cfd4e6;cursor:default}
.ecard.lk .th{display:grid;place-items:center;font-size:30px;color:#b8bed3}
.ecard.lk b{color:#9aa2bd}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{padding:6px 12px;border-radius:20px;background:#eef;font-weight:800;font-size:13px}
.filt button.on{background:#4a5ff0;color:#fff}
.evc{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:16px;align-items:start}
.evc .th{border-radius:18px;overflow:hidden;aspect-ratio:400/220}
.evc dl{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;font-size:15px;line-height:1.5}
.evc dt{font-weight:900;color:#4a5ff0;white-space:nowrap}
@media(max-width:640px){.evc{grid-template-columns:1fr}}
.mlist .ms{border-radius:16px;background:#f5f7fd;padding:12px 14px;margin-bottom:10px}
.mlist .ms h3{font-size:17px;font-weight:900}
.mlist li{list-style:none;padding:4px 0;font-size:15px}
/* 토스트 */
#toast{position:fixed;right:14px;top:76px;z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tst{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 14px 8px 8px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:slin .5s cubic-bezier(.2,1.4,.4,1) both;border:3px solid #ffd23a;max-width:330px}
.tst .th{width:64px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0}
.tst b{font-size:12px;color:#e07a00;display:block}
.tst span{font-size:14px;font-weight:800;line-height:1.3}
.tst.out{animation:slout .4s both}
@keyframes slin{from{transform:translateX(120%) rotateY(70deg)}}
@keyframes slout{to{transform:translateX(120%);opacity:0}}
/* 스테이지 2 */
.th-s2{background:linear-gradient(180deg,#ffe8f0,#fff7ec)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{background:#fff;padding:10px 14px;border-radius:16px;font-weight:900;box-shadow:0 4px 0 #f1c9d6;border:3px solid transparent}
.tab.on{border-color:#f25c78;color:#d63a5a}
.tab .ck{color:#16a874}
.mcard{background:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(200,80,120,.12)}
.mcard h3{font-size:clamp(18px,2.6vw,24px);font-weight:900}
.mdesc{color:var(--sub);font-weight:600;margin:4px 0 12px;line-height:1.5}
.era{display:flex;align-items:center;gap:10px;margin:10px 0 16px;flex-wrap:wrap}
.era button{padding:10px 14px;border-radius:14px;font-weight:900;background:#eef1fb}
.era button.on{background:#4a5ff0;color:#fff}
.era input{flex:1;min-width:140px}
.sbs .sb{display:grid;grid-template-columns:80px 1fr 90px 90px;align-items:center;gap:8px;margin:12px 0}
.sb .sl{font-weight:900;font-size:17px}
.sb .tr{height:38px;background:#f1f3f9;border-radius:12px;position:relative;overflow:hidden}
.sb .fi{position:absolute;left:0;top:0;bottom:0;border-radius:12px;transition:box-shadow .3s}
.sb .gh{position:absolute;top:3px;bottom:3px;border:3px dashed rgba(0,0,0,.35);border-radius:10px;left:0}
.sb .nm{font-size:24px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.sb .df{font-weight:900;font-size:17px;padding:5px 8px;border-radius:12px;text-align:center;opacity:0;transform:scale(.6);transition:.4s}
.sb .df.on{opacity:1;transform:none}
.up{background:#ffe1e7;color:#d6284f}.dn{background:#dcecff;color:#1d63c4}
.yb{display:flex;height:46px;border-radius:14px;overflow:hidden;margin-top:6px}
.yb div{display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden}
.summary{margin-top:14px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#fff0f3,#eaf3ff);font-weight:800;line-height:1.6;display:none}
.summary.on{display:block;animation:pop .4s}
@media(max-width:600px){.sbs .sb{grid-template-columns:56px 1fr 64px 60px}.sb .nm{font-size:18px}.sb .df{font-size:13px}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split .pn{border-radius:18px;overflow:hidden;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.split .pn h4{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-weight:900;padding:4px 12px;border-radius:12px;z-index:2}
.split .pn .st2{position:absolute;right:10px;bottom:10px;background:#fff;font-weight:900;padding:4px 10px;border-radius:12px;font-size:14px;z-index:2}
.spanel{display:block;width:100%;height:auto}
.spanel .flake{animation:snow 3s linear infinite}
@keyframes snow{from{transform:translateY(-30px)}to{transform:translateY(240px)}}
.date{font-size:26px;font-weight:900;text-align:center;margin:12px 0 4px}
.tl{position:relative;height:56px;margin:6px 6px 0}
.tl .ln{position:absolute;left:0;right:0;top:24px;height:8px;border-radius:6px;background:linear-gradient(90deg,#9cc3ff 0,#c7e3ff 40%,#ffd1df 70%,#b9f0b0)}
.tl .mk{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:900;text-align:center;white-space:nowrap}
.tl .mk i{display:block;width:4px;height:20px;margin:0 auto;border-radius:2px}
@media(max-width:620px){.split{grid-template-columns:1fr}}
.m3{display:grid;grid-template-columns:minmax(260px,430px) 1fr;gap:16px}
.cre{position:absolute;transform:translate(-50%,-50%);transition:left 1.6s cubic-bezier(.4,0,.2,1),top 1.6s cubic-bezier(.4,0,.2,1),opacity 1.2s,transform 1.2s;width:9%;aspect-ratio:1;pointer-events:none}
.cre svg{width:100%;height:100%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cre.pulse{animation:pls 1.4s infinite}
@keyframes pls{50%{transform:translate(-50%,-50%) scale(1.35)}}
.crebtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.crb{background:#fff;border-radius:16px;padding:8px;font-weight:900;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 #dcd3f0;border:3px solid transparent;font-size:14px}
.crb svg{width:34px;height:34px}
.crb.on{border-color:#8b5cf6}
.crb .ck{color:#16a874}
.tip{background:#f6f2ff;border-radius:16px;padding:14px;margin-top:10px;line-height:1.65}
.tip h4{font-size:19px;font-weight:900;margin-bottom:6px}
.tip p{margin:4px 0}
.tip .mv{display:inline-block;background:#8b5cf6;color:#fff;font-weight:900;padding:3px 10px;border-radius:10px;margin-top:6px}
@media(max-width:760px){.m3{grid-template-columns:1fr}}
/* 스테이지 3 */
.th-s3{background:linear-gradient(180deg,#0b3d6b,#1170a8)}
.wmap{position:relative;max-width:1000px;margin:12px auto;border-radius:26px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.wmap svg{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:.2s}
.pin:hover{transform:translate(-50%,-108%) scale(1.06)}
.pin .pb{color:#1c2340;background:#fff;border-radius:16px;padding:6px 10px;font-weight:900;font-size:clamp(11px,1.5vw,15px);box-shadow:0 6px 16px rgba(0,0,0,.3);white-space:nowrap;display:flex;align-items:center;gap:4px}
.pin .pb i{font-style:normal;font-size:1.4em}
.pin .pt{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #fff}
.pin.got .pb{background:#16a874;color:#fff}.pin.got .pt{border-top-color:#16a874}
.pin .bb{width:16px;height:16px;border-radius:50%;background:#ff4a3a;margin-top:2px;box-shadow:0 0 0 0 rgba(255,74,58,.7);animation:ring 1.6s infinite}
@keyframes ring{to{box-shadow:0 0 0 18px rgba(255,74,58,0)}}
.field{min-height:100%;background:#eef3fa}
.fhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:12px}
.scene{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/10;background:#123;box-shadow:0 12px 30px rgba(0,0,0,.25);touch-action:manipulation}
.scene svg.sc,.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fside{display:flex;flex-direction:column;gap:10px}
.fmis{background:#1c2a6a;color:#fff;border-radius:16px;padding:12px 14px;font-weight:800;line-height:1.5}
.ctrl{background:#fff;border-radius:16px;padding:14px}
.ctrl label{font-weight:900;display:block;margin-bottom:8px}
.rl{display:flex;justify-content:space-between;font-size:12px;color:#777;font-weight:700;margin-top:6px}
.flog{background:#fff;border-radius:16px;padding:12px;max-height:340px;overflow-y:auto}
.flog .fact{background:#f2f6ff;border-left:5px solid #4a5ff0;border-radius:10px;padding:8px 10px;margin-bottom:8px;line-height:1.55;animation:pop .35s;font-size:15px}
.flog .hint{color:#777;font-weight:600}
.hs{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid #fff;display:grid;place-items:center;font-size:24px;animation:ring2 1.6s infinite;z-index:3}
.hs.got{background:#16a874;animation:none}
.hs.off{opacity:.35;pointer-events:none;animation:none}
@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 20px rgba(255,255,255,0)}}
.tog{display:flex;gap:8px;flex-wrap:wrap}
.tog button{flex:1;min-width:110px;padding:10px;border-radius:14px;background:#eef1fb;font-weight:900}
.tog button.on{background:#ff6b4a;color:#fff}
.meter{height:22px;border-radius:12px;background:#eee;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23a,#ff3d00);transition:width .5s}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#e8395b;color:#fff;font-weight:900;padding:6px 14px;border-radius:12px;z-index:4;animation:blink2 .8s infinite;display:none;white-space:nowrap}
.cmpr{position:absolute;left:0;right:0;bottom:12px;width:90%;margin:0 5%;z-index:5}
.cmpl{position:absolute;top:0;bottom:0;width:4px;background:#fff;z-index:4;box-shadow:0 0 10px rgba(0,0,0,.5);pointer-events:none}
.cmpl::after{content:'◀ ▶';position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:6px 8px;border-radius:20px;font-size:12px;font-weight:900;white-space:nowrap}
.tagl{position:absolute;top:12px;background:rgba(0,0,0,.6);color:#fff;font-weight:900;padding:4px 10px;border-radius:10px;z-index:4}
.cal{display:grid;grid-template-columns:70px repeat(12,1fr);gap:2px;font-size:11px;font-weight:800;margin-top:10px;align-items:center}
.cal i{height:18px;border-radius:4px;background:#eef0f6;transition:background .4s}
.cal i.on{background:#ff8a4c}
.cal span{text-align:center;color:#888}
.frow{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:center;margin:8px 0}
.frow b{font-weight:900}
.ftrack{position:relative;height:70px;background:linear-gradient(90deg,#e7f0ff,#fff0f5 50%,#e9fbe4);border-radius:14px}
.fl{position:absolute;bottom:6px;transform:translateX(-50%);text-align:center;font-size:11px;font-weight:900;transition:.3s}
.fl .fx{font-size:30px;display:block;transition:transform .4s,filter .4s;filter:grayscale(1) opacity(.45);transform:scale(.6)}
.fl.on .fx{filter:none;transform:scale(1.1)}
.now{position:absolute;top:0;bottom:0;width:3px;background:#ff4a3a;border-radius:2px}
@media(max-width:820px){.fgrid{grid-template-columns:1fr}}
/* 스테이지 4 */
.th-s4{background:radial-gradient(ellipse at 50% 30%,#1b2f6e,#060b1e 70%);color:#fff}
.s4{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:10px}
.s4 .gbox{aspect-ratio:1;max-height:62vh;margin:0 auto;width:100%;position:relative}
.s4 .gbox canvas{width:100%;height:100%}
.tbadge{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font-size:clamp(22px,4vw,38px);font-weight:900;background:rgba(0,0,0,.45);padding:6px 18px;border-radius:20px;white-space:nowrap}
.stops{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-top:8px;color:#cfe0ff}
.ind{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ib{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px}
.ib h4{font-size:15px;font-weight:900;margin-bottom:4px}
.ib .v{font-size:22px;font-weight:900;color:#ffd77a}
.ib p{font-size:13px;line-height:1.5;opacity:.92}
.ib .lv{height:8px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}
.ib .lv i{display:block;height:100%;background:linear-gradient(90deg,#ffd23a,#ff5a3a);transition:width .6s}
.disc{background:rgba(255,214,90,.15);border:1px dashed #ffd65a;border-radius:12px;padding:10px;font-size:13px;margin-top:10px;line-height:1.5;color:#ffeab0}
@media(max-width:860px){.s4{grid-template-columns:1fr}}
/* 스테이지 5 */
.th-s5{background:linear-gradient(180deg,#fff6dc,#ffe8c2)}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.ra{background:#fff;border-radius:22px;padding:14px;box-shadow:0 8px 22px rgba(160,100,0,.14);border-top:8px solid var(--ac)}
.ra h3{font-size:18px;font-weight:900}
.ra .rp{height:10px;border-radius:6px;background:#f1ece0;overflow:hidden;margin:8px 0}
.ra .rp i{display:block;height:100%;background:var(--ac);transition:width .8s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:#f7f5ef;border-radius:12px;padding:4px 8px 4px 4px;font-size:13px;font-weight:800;animation:pop .4s both}
.chip .th{width:40px;height:26px;border-radius:7px;overflow:hidden}
.ra .ok{color:#16a874;font-weight:900}
.final{display:flex;flex-direction:column;align-items:center;gap:12px;margin:22px 0}
.fg{width:min(320px,70vw);aspect-ratio:1;position:relative}
.fg canvas{width:100%;height:100%}
#cert{background:#fffdf4;border:10px double #d4a72c;border-radius:20px;padding:26px;text-align:center;position:relative}
#cert h1{font-size:clamp(24px,4vw,36px);font-weight:900;color:#8a5a00}
#cert .nm{font-size:30px;font-weight:900;margin:12px 0;border-bottom:3px solid #d4a72c;display:inline-block;padding:0 20px}
#cert p{font-size:17px;line-height:1.7}
#cert .seal{position:absolute;right:24px;bottom:20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(#ff6b4a,#c8301a);color:#fff;font-weight:900;display:grid;place-items:center;transform:rotate(-12deg);box-shadow:0 0 0 4px #fff,0 0 0 7px #c8301a;font-size:14px;line-height:1.2}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:95;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media print{body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:fixed;left:0;top:0;right:0}}
.tvs .anchor svg{width:clamp(70px,13vw,140px);height:auto}
.zin{position:relative}#crs{position:absolute;inset:0}
.fl .fx svg{width:clamp(22px,4vw,34px);height:auto}
.ftrack{height:clamp(50px,9vw,70px)}
.bef{position:absolute;inset:0;z-index:2}
.fireov{opacity:0;transition:opacity .6s}
.cp{transition:transform .4s}
.fg canvas,.globebox canvas,.s4 .gbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 애니메이션 */
.spin{animation:spinr 18s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.flick{animation:flk .25s infinite alternate;transform-origin:center bottom}
@keyframes flk{to{opacity:.8;transform:scaleY(1.04)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.flap{animation:flp .35s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flp{to{transform:scaleX(.55)}}
.petals{animation:fall 6s linear infinite}
@keyframes fall{from{transform:translate(0,-60px)}to{transform:translate(-40px,80px)}}
.rainfx{animation:rn .5s linear infinite}
@keyframes rn{from{transform:translate(0,-20px)}to{transform:translate(-4px,0)}}

let _u=0;const uid=()=>'u'+(_u++);
function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const SV=(b,vb='0 0 400 220')=>`<svg class="art" viewBox="${vb}" preserveAspectRatio="xMidYMid slice">${b}</svg>`;
const lg=(id,c1,c2,h)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${h?1:0}" y2="${h?0:1}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
const rg=(id,c1,c2,o=1)=>`<radialGradient id="${id}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}" stop-opacity="${o}"/></radialGradient>`;
function dots(n,seed,x,y,w,h,r1,r2,cols,op=1,cls=''){const R=rnd(seed);let s='';for(let i=0;i<n;i++){const a=R()*6.283,d=Math.sqrt(R());s+=`<circle ${cls?`class="${cls}"`:''} cx="${(x+Math.cos(a)*d*w).toFixed(1)}" cy="${(y+Math.sin(a)*d*h).toFixed(1)}" r="${(r1+R()*(r2-r1)).toFixed(1)}" fill="${cols[i%cols.length]}" opacity="${op}"/>`}return s}
function jellyS(x,y,s,c,cls=''){return `<g class="${cls}" transform="translate(${x} ${y}) scale(${s})"><path d="M-20 0Q-21-26 0-26Q21-26 20 0Q10-5 0 0Q-10-5-20 0Z" fill="${c}" opacity=".78"/><path d="M-12-8Q0-20 12-8" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none"/><g stroke="${c}" stroke-width="2.2" fill="none" opacity=".7" stroke-linecap="round"><path d="M-13 0q-5 10 0 20t0 20"/><path d="M-4 0q5 12 0 24t0 24"/><path d="M5 0q-5 11 0 22t0 20"/><path d="M14 0q5 9 0 18t0 18"/></g></g>`}
function fishS(x,y,s,c,flip){return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})"><path d="M-16 0Q-4-11 12-2L20-9L19 0L20 9L12 2Q-4 11-16 0Z" fill="${c}"/><circle cx="-9" cy="-2" r="1.8" fill="#fff"/><circle cx="-9" cy="-2" r=".9" fill="#111"/></g>`}
function treeS(x,y,s,leaf,fruit,seed){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-4" y="0" width="8" height="34" rx="3" fill="#6b4428"/><circle cx="0" cy="-8" r="26" fill="${leaf}"/><circle cx="-14" cy="2" r="16" fill="${leaf}"/><circle cx="15" cy="0" r="17" fill="${leaf}"/><circle cx="-6" cy="-18" r="12" fill="#ffffff" opacity=".12"/>${fruit?dots(9,seed,0,-6,22,18,3,4.5,[fruit]):''}</g>`}
function pine(x,y,s,c){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-2.5" y="0" width="5" height="12" fill="#5a3a22"/><path d="M0-46L16-16H8L20 2H-20L-8-16H-16Z" fill="${c}"/></g>`}

 const z=(f,cx=w.clientWidth/2,cy=w.clientHeight/2)=>{const ns=Math.min(3,Math.max(1,s*f));x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;ap()};
 p.onclick=()=>z(1.4);m.onclick=()=>z(1/1.4);
 w.addEventListener('wheel',e=>{e.preventDefault();const r=w.getBoundingClientRect();z(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top)},{passive:false});

 t4.oninput=upd;upd();if(S.f.s4)$('.disc').insertAdjacentHTML('afterend','<div style="text-align:center;margin-top:14px"><button class="btn" id="s4go" onclick="go(\'s5\')">🏆 STAGE 5 보고서로 가기</button></div>')};

// ===== STAGE 5 =====
const SUMS=['','기온이 오르면서 <b>여름은 길어지고 겨울은 짧아졌어요.</b> 봄꽃도 일찍 피어요.','기온이 오르면서 <b>농작물을 기르기 알맞은 지역이 바뀌었어요.</b>','생물마다 알맞은 온도가 달라 <b>사는 곳이 넓어지거나 줄어들어요.</b>','폭염, 감염병, 산불, 가뭄, 홍수처럼 <b>생활과 환경에 다양한 변화</b>가 나타나요.'];
SCR.s5=()=>{if(!guard(5))return;const AC=['','#f25c78','#e88a0c','#3e9e3e','#4a5ff0'],ok=areaDone()===4;
 view.innerHTML=`<div class="inst th-s5"><div class="wrap"><div class="ihead"><div><button class="back" onclick="go('hub')">← 지도</button><h2 style="margin-top:8px">🏆 STAGE 5 · 최종 미션 – 기후변화 수사 보고서</h2><p>지금까지 모은 증거 카드가 보고서의 네 영역에 <b>자동으로 연결</b>돼요. 영역마다 증거를 3개 이상 모으면 완성!</p></div><div class="labcnt" style="background:#c26a00">완성 영역 ${areaDone()} / 4 · 증거 ${nEv()}개</div></div>
 <div class="rep">${[1,2,3,4].map(a=>{const es=EV.filter(e=>e.a===a&&has(e.id));return `<div class="ra" style="--ac:${AC[a]}"><h3>${AREA_IC[a]} ${a}. ${AREAS[a]}</h3><div class="rp"><i style="width:${Math.min(100,es.length/3*100)}%"></i></div>${es.length>=3?'<p class="ok">✔ 조사 완료!</p>':`<p style="color:#b55;font-weight:800">증거 ${3-es.length}개 더 필요해요</p>`}<div class="chips">${es.map((e,i)=>`<button class="chip" style="animation-delay:${i*.06}s" onclick="showCard('${e.id}')"><span class="th">${ART[e.g]()}</span>${plain(e.t).replace(/\[.*?\]\s*/,'')}</button>`).join('')||'<span style="color:#999">아직 연결된 증거가 없어요</span>'}</div><p style="margin-top:10px;font-size:14px;color:#555;line-height:1.5;border-top:1px dashed #eee;padding-top:8px">🔑 ${SUMS[a]}</p></div>`}).join('')}</div>
 <div class="final"><div class="fg"><canvas id="g5"></canvas></div>${ok?`<button class="btn green" id="fin" style="font-size:20px;padding:14px 30px">🌍 보고서 제출하고 인증서 받기</button>`:`<p style="font-weight:800;color:#8a5a00;text-align:center">모든 영역을 완성하면 지구본이 밝아지고 최종 탐사대원 인증서를 받을 수 있어요!</p><button class="btn blue" onclick="openCodex()">📖 도감에서 부족한 증거 확인하기</button>`}</div></div></div>`;
 const E=earth($('#g5'),{t:S.f.cert?0:1.5,bright:S.f.cert?1:areaDone()/4*.35,speed:.006});onLeave(E.stop);
 if(ok)$('#fin').onclick=()=>{E.setT(0);E.setB(1);confetti();if(!S.f.cert){S.f.cert=1;save();addPts(50)}updHUD();setTimeout(cert,1600)}};
function confetti(){const C=['#ff5f3a','#ffd23a','#3ad69a','#6a8bff','#f25c78','#8b5cf6'];for(let i=0;i<80;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=C[i%6];d.style.animationDuration=2+Math.random()*2.5+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}}
function cert(){const dt=new Date();openModal(`<div id="cert"><div style="display:flex;justify-content:center;gap:10px;align-items:center">${AV(S.av||0,90)}${BOT(90)}</div><h1>🏅 최종 탐사대원 인증서</h1><div class="nm">${esc(S.nick)}</div><p>위 연구원은 기후변화 수사대에서<br>계절의 길이, 농작물 재배 지역, 동식물 서식 지역,<br>우리 생활과 환경에 나타나는 변화를 끝까지 조사하여<br><b>기후변화가 우리 생활과 환경에 미치는 영향</b>을 밝혀냈기에<br>이 인증서를 드립니다.</p><p style="margin-top:12px;font-weight:800">수집한 증거 ${nEv()}개 · Lv.${lvl()} ${TITLES[lvl()-1]} · 조사 포인트 ${S.pts}점</p><p style="margin-top:8px">${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일</p><p style="font-weight:900;margin-top:6px">기후변화 수사대 본부장 AI 연구원 써미</p><div class="seal">기후<br>수사대<br>인증</div></div><div style="text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn blue" onclick="window.print()">🖨️ 인증서 인쇄하기</button><button class="btn green" onclick="closeModal();go('hub')">🌍 지도로 돌아가기</button></div>`)}

// ===== 시작 =====
updHUD();
if(S.nick&&S.at&&SCR[S.at[0]])go(S.at[0],S.at[1]);else go('intro');
